<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Rounded Rect with dashed border -->
  <rect x="5" y="5" width="110" height="110" rx="15" fill="none" stroke="#FF334B" stroke-width="4" stroke-dasharray="8,6" />
  
  <!-- "HECHO EN" text rotated vertically on the left -->
  <text x="-95" y="25" fill="#FF334B" font-family="'Lexend', 'Manrope', sans-serif" font-weight="800" font-size="10" transform="rotate(-90)" letter-spacing="1.5">HECHO EN</text>
  
  <!-- "yu" "ca" "tan" text layout -->
  <g fill="#FF334B" font-family="'Lexend', 'Manrope', sans-serif" font-weight="900" font-size="28" letter-spacing="-0.5">
    <text x="38" y="42">yu</text>
    <text x="44" y="68">ca</text>
    <text x="32" y="94">tan</text>
  </g>
  
  <!-- Registered trademark mark ® -->
  <circle cx="82" cy="55" r="3.5" fill="none" stroke="#FF334B" stroke-width="0.8" />
  <text x="80.5" y="57.5" fill="#FF334B" font-family="sans-serif" font-size="6" font-weight="bold">R</text>
</svg>
